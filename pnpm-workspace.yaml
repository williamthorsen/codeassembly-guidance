allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: false

catalog:
  '@types/node': '24.19.2'
  '@williamthorsen/change-grammar': '0.4.1'
  '@williamthorsen/nmr': '2.2.1'
  '@williamthorsen/toolbelt.errors': '0.10.1'
  '@williamthorsen/toolbelt.terminal': '0.3.1'
  '@williamthorsen/toolbelt.testing': '0.8.3'
  '@williamthorsen/toolbelt.vitest': '0.13.5'
  codeassembly: '0.20.2'
  esbuild: '0.28.2'
  eslint: '10.14.0'
  happy-dom: '21.0.4'
  prettier: '3.10.1'
  readyup: '0.46.2'
  vite: '8.3.8'
  vitest: '5.1.0'
  yaml: '2.9.1'
  zod: '4.6.7'

minimumReleaseAge: 1440 # 24h supply-chain soak (minutes)
# Published by williamthorsen/codeassembly's CI and consumed here right after release.
minimumReleaseAgeExclude:
  - '@williamthorsen/kb'
  - codeassembly

packages:
  - packages/*

savePrefix: ''

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
trustPolicyExclude:
  # A 2023 backport of a ReDoS fix to the v6 line, published without provenance after 7.5.x had it;
  # Babel, which eslint-plugin-react-hooks uses, requires semver ^6.
  - semver@6.3.1
